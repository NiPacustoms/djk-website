# Redaktionssystem (Sveltia CMS) für die DJK-Website.
# Änderungen werden als Commit im GitHub-Repository gespeichert, danach baut und veröffentlicht GitHub Actions die Seite automatisch.

backend:
  name: github
  repo: NiPacustoms/djk-website
  branch: main
  commit_messages:
    create: 'Inhalt: {{collection}} „{{slug}}“ angelegt'
    update: 'Inhalt: {{collection}} „{{slug}}“ geändert'
    delete: 'Inhalt: {{collection}} „{{slug}}“ gelöscht'
locale: de
media_folder: content/uploads
public_folder: uploads
site_url: https://www.djkspvggherten.de
logo_url: /assets/icon-512.png
collections:
- name: news
  label: News
  label_singular: Beitrag
  folder: content/news
  extension: md
  format: frontmatter
  create: true
  slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
  sortable_fields:
  - date
  - title
  summary: '{{date}} · {{title}}'
  fields:
  - name: title
    label: Überschrift
    widget: string
  - name: date
    label: Datum
    widget: datetime
    time_format: false
    date_format: DD.MM.YYYY
    format: YYYY-MM-DD
  - name: tag
    label: Bereich
    widget: select
    options:
    - Verein
    - Jugend
    - Damen
    - Herren
    - Turnen
    - Event
  - name: image
    label: Bild
    widget: image
    hint: Querformat oder Plakat. Wird beim Veröffentlichen automatisch verkleinert.
  - name: body
    label: Text
    widget: markdown
    buttons:
    - bold
    - italic
    - link
    editor_components: []
    hint: Absätze mit einer Leerzeile trennen.
- name: einstellungen
  label: Platzstatus und Termine
  files:
  - name: status
    label: Platzstatus / Hinweis-Banner
    file: content/status.json
    fields:
    - name: active
      label: Hinweis anzeigen
      widget: boolean
      default: false
    - name: level
      label: Art
      widget: select
      options:
      - label: Hinweis (gelb)
        value: info
      - label: Wichtig, z. B. Platz gesperrt (rot)
        value: warn
      - label: Entwarnung (grün)
        value: ok
      default: info
    - name: title
      label: Überschrift
      widget: string
      required: false
      hint: z. B. Platz gesperrt
    - name: text
      label: Text
      widget: string
      required: false
      hint: z. B. Heute fällt das Training aller Jugendteams aus.
    - name: until
      label: Automatisch ausblenden nach
      widget: datetime
      time_format: false
      format: YYYY-MM-DD
      required: false
  - name: termine
    label: Termine
    file: content/termine.json
    fields:
    - name: events
      label: Termine
      label_singular: Termin
      widget: list
      summary: '{{fields.date}} · {{fields.title}}'
      fields:
      - name: title
        label: Titel
        widget: string
      - name: date
        label: Datum
        widget: datetime
        time_format: false
        format: YYYY-MM-DD
      - name: end
        label: Bis (bei mehrtägigen Terminen)
        widget: datetime
        time_format: false
        format: YYYY-MM-DD
        required: false
      - name: time
        label: Uhrzeit
        widget: string
        required: false
        hint: z. B. 19:00
      - name: place
        label: Ort
        widget: string
        required: false
      - name: text
        label: Beschreibung
        widget: text
        required: false
