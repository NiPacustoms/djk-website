# Baut, prüft und veröffentlicht die Website.
# Ziel: Cloudflare Pages (mit Statistik und Admin-Login), sobald die Secrets CLOUDFLARE_API_TOKEN und
# CLOUDFLARE_ACCOUNT_ID hinterlegt sind. Bis dahin: GitHub Pages (alles außer Statistik und Login).
# Läuft bei jeder Änderung (auch aus dem CMS) und zweimal täglich für den Spielplan.
name: Website

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"
    - cron: "17 16 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: website
  cancel-in-progress: false

env:
  CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Spielplan von fussball.de aktualisieren
        run: node scripts/fetch-matches.mjs

      - name: Neuen Spielplan speichern
        run: |
          if ! git diff --quiet content/spiele.json; then
            git config user.name "DJK Website Bot"
            git config user.email "bot@djkspvggherten.de"
            git add content/spiele.json
            git commit -m "Spielplan aktualisiert [skip ci]"
            git push
          fi

      - name: Zieladresse festlegen
        run: |
          if [ -n "$CF_TOKEN" ]; then
            echo "SITE_URL=${{ vars.SITE_URL || 'https://www.djkspvggherten.de' }}" >> "$GITHUB_ENV"
          else
            OWNER="${GITHUB_REPOSITORY%%/*}"; REPO="${GITHUB_REPOSITORY#*/}"
            echo "SITE_URL=${{ vars.SITE_URL }}" | grep -q "https" && echo "SITE_URL=${{ vars.SITE_URL }}" >> "$GITHUB_ENV" \
              || echo "SITE_URL=https://${OWNER,,}.github.io/${REPO}" >> "$GITHUB_ENV"
            echo "ANALYTICS=off" >> "$GITHUB_ENV"
          fi

      - name: Website bauen
        run: npm run build

      - name: Qualitätsprüfung (DESIGN.md, Links, Layout, Tippflächen)
        run: |
          npx --yes playwright@1.56.1 install --with-deps chromium
          npm i --no-save playwright@1.56.1
          npm test
          (cd dist && python3 -m http.server 8768 >/dev/null 2>&1 &) && sleep 1
          npm run test:tap

      - name: Auf Cloudflare Pages veröffentlichen
        if: env.CF_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=djk-spvgg-herten --branch=main

      - name: GitHub Pages vorbereiten
        if: env.CF_TOKEN == ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Auf GitHub Pages veröffentlichen
        if: env.CF_TOKEN == ''
        uses: actions/deploy-pages@v4
